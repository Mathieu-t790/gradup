version: "3.8"

services:
  gradup-pg:
    image: postgres:13.9
    container_name: gradup-pg
    environment:
      POSTGRES_DB: gradup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gradup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  gradup-app:
    build: .
    container_name: gradup-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gradup-pg:5432/gradup
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ADMIN_EMAIL: admin@hei.school
      ADMIN_PASSWORD: admin123
      AWS_S3_BUCKET: dummy-bucket
      AWS_EVENTBRIDGE_BUS: dummy-bus
    depends_on:
      gradup-pg:
        condition: service_healthy

volumes:
  gradup-pgdata:
