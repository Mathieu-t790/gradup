<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradup - Années académiques</title>
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
  <div th:replace="~{fragments/layout :: sidebar('academic-years')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: header('Années académiques')}"></div>

    <div class="card animate-fade-in-up" style="margin-bottom:24px;">
      <h3 style="font-size:16px;font-weight:700;color:var(--hei-blue);margin-bottom:16px;">Créer une année académique</h3>
      <form th:action="@{/academic-years}" method="post" style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;">
          <label for="label">Label</label>
          <input type="text" id="label" name="label" class="form-control" placeholder="2024-2025" required>
        </div>
        <div class="form-group" style="margin:0;">
          <label for="startDate">Date de début</label>
          <input type="date" id="startDate" name="startDate" class="form-control" required>
        </div>
        <div class="form-group" style="margin:0;">
          <label for="endDate">Date de fin</label>
          <input type="date" id="endDate" name="endDate" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success btn-sm">Créer</button>
      </form>
    </div>

    <div class="card animate-fade-in-up stagger-2">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Label</th>
              <th>Date de début</th>
              <th>Date de fin</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="year : ${academicYears}" class="animate-fade-in-up">
              <td><span class="badge badge-blue" th:text="${year.label}"></span></td>
              <td th:text="${year.startDate}"></td>
              <td th:text="${year.endDate}"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${#lists.isEmpty(academicYears)}" class="empty-state">
        <div class="icon">&#128197;</div>
        <h3>Aucune année académique</h3>
        <p>Créez votre première année académique ci-dessus.</p>
      </div>
    </div>
  </div>
  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
