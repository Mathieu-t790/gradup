<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Helvetica, Arial, sans-serif; font-size: 14px; color: #000;">
  <div style="max-width: 600px; margin: 24px auto; background-color: #ffffff; padding: 32px; border: 1px solid #e0e0e0;">
    <p>Bonjour <span th:text="${studentName}">—</span>,</p>
    <p>Votre relevé de notes est disponible et vous a été adressé en pièce jointe.</p>
    <p>Pour toute question, vous pouvez contacter l'administration de l'école.</p>
    <p>Cordialement,</p>
    <div style="margin-top: 16px;">
      <img th:src="${signatureDataUri}" alt="Haute École d'Informatique" style="max-width: 320px; height: auto;" />
    </div>
  </div>
</body>
</html>
