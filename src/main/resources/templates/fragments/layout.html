<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="sidebar(active)">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <img th:src="@{/images/HEI_logo.png}" alt="HEI">
    </div>
    <div class="sidebar-nav">
      <div class="sidebar-section">Principal</div>
      <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Tableau de bord
      </a>

      <div class="sidebar-section">Gestion</div>
      <a th:href="@{/web/students}" th:classappend="${active == 'students'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Étudiants
      </a>
      <a th:href="@{/web/cohorts}" th:classappend="${active == 'cohorts'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Promotions
      </a>

      <div class="sidebar-section">Académique</div>
      <a th:href="@{/web/academic-years}" th:classappend="${active == 'academic-years'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Années académiques
      </a>
      <a th:href="@{/web/semesters}" th:classappend="${active == 'semesters'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Semestres
      </a>
      <a th:href="@{/web/courses}" th:classappend="${active == 'courses'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Cours
      </a>

      <div class="sidebar-section">Évaluation</div>
      <a th:href="@{/web/exams}" th:classappend="${active == 'exams'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Examens
      </a>
      <a th:href="@{/web/grades}" th:classappend="${active == 'grades'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        Notes
      </a>
      <a th:href="@{/web/disputes}" th:classappend="${active == 'disputes'} ? 'active'" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Litiges
      </a>
    </div>
  </nav>
</th:block>

<th:block th:fragment="header(title)">
  <header class="main-header">
    <h1 th:text="${title}">Page</h1>
    <div class="header-actions">
      <div class="user-badge" sec:authorize="isAuthenticated()">
        <span class="avatar" sec:authentication="name">U</span>
        <span sec:authentication="name">Utilisateur</span>
      </div>
      <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit" class="btn btn-outline btn-sm">Déconnexion</button>
      </form>
    </div>
  </header>
</th:block>

<th:block th:fragment="scripts">
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
