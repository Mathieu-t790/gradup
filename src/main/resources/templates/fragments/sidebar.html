<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="sidebar(active)">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <img th:src="@{/images/HEI_logo.png}" alt="HEI">
      <span class="sidebar-brand" th:text="${appName}">Gradup</span>
    </div>
    <div class="sidebar-nav">
      <th:block sec:authorize="hasRole('ADMIN')">
        <div class="sidebar-section" th:text="${navMain}">Principal</div>
        <a th:href="@{/promotions}" th:classappend="${active == 'promotions'} ? 'active'" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span th:text="${navPromotions}">Promotions</span>
        </a>
      </th:block>
      <th:block sec:authorize="hasRole('STUDENT')">
        <div class="sidebar-section" th:text="${navMain}">Principal</div>
        <a th:href="@{/student/grades}" th:classappend="${active == 'grades'} ? 'active'" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10"/>
            <line x1="18" y1="20" x2="18" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="16"/>
          </svg>
          <span th:text="${navGrades}">Mes notes</span>
        </a>
      </th:block>
      <th:block sec:authorize="hasRole('TEACHER')">
        <div class="sidebar-section" th:text="${navMain}">Principal</div>
        <a th:href="@{/teacher/courses}" th:classappend="${active == 'courses'} ? 'active'" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span th:text="${navCourses}">Mes cours</span>
        </a>
      </th:block>
    </div>
  </nav>
</th:block>

</body>
</html>
