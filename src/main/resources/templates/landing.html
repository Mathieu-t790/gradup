<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${landingTitle}">Gradup</title>
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="landing-body">
  <div th:replace="~{fragments/app-header :: header}"></div>

  <main class="landing-hero">
    <div class="landing-hero-card animate-fade-up">
      <div class="landing-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10L12 5 2 10l10 5 10-5z"/>
          <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
        </svg>
      </div>
      <h1 th:text="${landingTitle}">Gradup</h1>
      <p class="landing-subtitle" th:text="${landingSubtitle}">Gérez les promotions et téléchargez la liste des diplômés.</p>
      <a th:href="@{/login}" class="btn btn-primary btn-lg" th:text="${loginLabel}">Se connecter</a>
      <span class="landing-note" th:text="${accessNote}">Accès réservé à l'administration</span>
    </div>
  </main>

  <footer class="app-footer" th:text="${footerLabel}">© HEI · Gradup</footer>
</body>
</html>
