<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Gradup - ' + ${student.user.firstName} + ' ' + ${student.user.lastName}">Gradup - Détail étudiant</title>
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
  <div th:replace="~{fragments/layout :: sidebar('students')}"></div>

  <div class="main-content">
    <div th:replace="~{fragments/layout :: header('Détail étudiant')}"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
      <div class="card animate-fade-in-up">
        <h3 style="font-size:16px;font-weight:700;color:var(--hei-blue);margin-bottom:16px;">Informations personnelles</h3>
        <div style="display:grid;gap:12px;">
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Référence</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.user.reference}"></span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Nom complet</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.user.lastName} + ' ' + ${student.user.firstName}"></span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Email</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.user.email}"></span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Date de naissance</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.dateOfBirth} ?: '—'"></span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;">
            <span style="color:var(--hei-gray);font-size:13px;">Statut</span>
            <span class="badge" th:classappend="${student.user.active} ? 'badge-green' : 'badge-red'"
                  th:text="${student.user.active} ? 'Actif' : 'Inactif'"></span>
          </div>
        </div>
      </div>

      <div class="card animate-fade-in-up stagger-1">
        <h3 style="font-size:16px;font-weight:700;color:var(--hei-blue);margin-bottom:16px;">Parcours académique</h3>
        <div style="display:grid;gap:12px;">
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Promotion</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.cohort.label}"></span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;">
            <span style="color:var(--hei-gray);font-size:13px;">Date d'inscription</span>
            <span style="font-weight:600;font-size:14px;" th:text="${student.enrollmentDate}"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card animate-fade-in-up stagger-2" th:if="${not #lists.isEmpty(groupHistory)}">
      <h3 style="font-size:16px;font-weight:700;color:var(--hei-blue);margin-bottom:16px;">Historique des groupes</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Groupe</th>
              <th>Date de début</th>
              <th>Date de fin</th>
              <th>Motif</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="entry : ${groupHistory}">
              <td><span class="badge badge-blue" th:text="${entry.group.reference}"></span></td>
              <td th:text="${entry.startDate}"></td>
              <td th:text="${entry.endDate} ?: 'En cours'"></td>
              <td th:text="${entry.changeReason} ?: '—'"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card animate-fade-in-up stagger-3" th:if="${not #lists.isEmpty(grades)}">
      <h3 style="font-size:16px;font-weight:700;color:var(--hei-blue);margin-bottom:16px;">Notes récentes</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Examen</th>
              <th>Cours</th>
              <th>Note</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="grade : ${grades}">
              <td th:text="${grade.exam.label}"></td>
              <td><span class="badge badge-blue" th:text="${grade.exam.offering.course.reference}"></span></td>
              <td>
                <span class="badge" th:classappend="${grade.score.doubleValue() >= 10} ? 'badge-green' : 'badge-red'"
                      th:text="${#numbers.formatDecimal(grade.score, 1, 1)} + ' / 20'"></span>
              </td>
              <td th:text="${#temporals.format(grade.recordedAt, 'dd/MM/yyyy')}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div style="margin-top:16px;">
      <a th:href="@{/web/students}" class="btn btn-outline">← Retour à la liste</a>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
